<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
</head>

<body>
 <section class="calculator">
   <header class="primary_content">
    <h1>Conversor de idade</h1>
    <p>Descubra sia idade de forma pratica e segura</p>
   </header>
   <form class="principal_section">
     <label>Data de Nascimento</label>
     <p>Informa sua idade de nascimento para calcular</p>
     <input type="number" id="numero" name="number" placeholder="DD/MM/AAAA">
     <button type="submit">
      <i class="fa-brands fa-calculator"></i>
      Calcular idade
     </button>
  
   </form>
   
   <section class="exibicao">
    <p>Sua idade é:</p>
    <section class="resultado">
     <div>
      <p>00</p>
      <h2>Anos</h2>
    </div>
    </section>

    
   </section>
   
 </section>
</body>

</html>
